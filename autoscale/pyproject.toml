[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-ebpf-autoscaler"
version = "1.0.0"
description = "eBPF-based PLC serial-port traffic monitor that dynamically scales MQTT decoder processes on Linux SBCs"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tinker" }]
requires-python = ">=3.10"
keywords = ["plc", "ebpf", "mqtt", "autoscaler", "industrial", "iot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking",
]

# Runtime dependencies installable via pip.
# NOTE: the BCC library (eBPF bindings) is provided by the system package
#       manager (e.g. `apt install python3-bpfcc`), not by pip.
#       Install it separately; see the README for instructions.
dependencies = [
    "paho-mqtt>=2.1.0,<3",
    "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
# Development / test tools.
dev = [
    "build>=1.2.2",
    "pytest>=8.3.5",
]

[project.scripts]
plc-adjust  = "adjust:main"
plc-decoder = "decoder:main"

[project.urls]
"Homepage"       = "https://github.com/http418imateapot/ot-edge-runtime"
"Bug Tracker"    = "https://github.com/http418imateapot/ot-edge-runtime/issues"
"Changelog"      = "https://github.com/http418imateapot/ot-edge-runtime/blob/main/autoscale/CHANGELOG.md"
"Security Policy"= "https://github.com/http418imateapot/ot-edge-runtime/blob/main/autoscale/SECURITY.md"
"Documentation"  = "https://github.com/http418imateapot/ot-edge-runtime/blob/main/autoscale/docs/PRODUCTION_DEPLOYMENT.md"

# ---------------------------------------------------------------------------
# Setuptools: treat adjust.py and decoder.py as top-level modules (no package
# directory needed — they live at the project root alongside pyproject.toml).
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = ["adjust", "decoder", "plc_config"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["."]
addopts      = "-v"
