<!-- dbus/com.example.RobustConfig.conf
     D-Bus system bus security policy for the robust-config daemon.

     Install to: /etc/dbus-1/system.d/com.example.RobustConfig.conf
     (done automatically by 'make install')

     What this policy grants
     -----------------------
       - root (the account the watch daemon runs as) may OWN the name
         com.example.RobustConfig and emit ConfigChanged signals under it.
       - Every other local user may RECEIVE ConfigChanged signals from that
         name, and may not own it or emit signals under its interface.

     Why owning the name matters
     ---------------------------
     Subscribers match on sender='com.example.RobustConfig'. That filter is only
     meaningful if the name is actually owned by the daemon — which is why
     src/ipc_dbus.c calls dbus_bus_request_name() before its first publish.
     Together they are what stops an unprivileged local process from forging a
     config change that every subscriber would otherwise accept as genuine.

     Tightening for production
     -------------------------
     Running the daemon as root is the default, not a recommendation. Create a
     dedicated system account, change User= in the systemd unit, and replace
     <policy user="root"> below with that account. If subscribers should also be
     restricted, replace the default policy's <allow receive_sender=...> with a
     per-group <policy group="..."> block.
-->
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- The daemon: owns the name and is the only thing allowed to emit under it. -->
  <policy user="root">
    <allow own="com.example.RobustConfig"/>
    <allow send_interface="com.example.RobustConfig"/>
    <allow receive_sender="com.example.RobustConfig"/>
  </policy>

  <!-- Everyone else: read-only. Subscribers receive ConfigChanged and nothing
       more. Note there is deliberately no <allow send_interface=...> here — an
       ordinary local process must not be able to publish a config change. -->
  <policy context="default">
    <allow receive_sender="com.example.RobustConfig"/>
    <deny own="com.example.RobustConfig"/>
    <deny send_interface="com.example.RobustConfig"/>
  </policy>

</busconfig>
